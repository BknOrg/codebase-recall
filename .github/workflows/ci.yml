name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      retrieval_benchmark:
        description: Run the full pinned BknDb retrieval benchmark (CPU intensive)
        type: boolean
        default: false
      indexing_benchmark:
        description: Run serial cold indexing and compact quality gates (CPU intensive)
        type: boolean
        default: false
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p test_retrieval_helpers.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test_graph_render.cjs
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --all-targets --no-default-features
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo test --locked --all-targets --no-default-features --features embeddings
      - run: cargo test --locked --all-targets --no-default-features --features viewer
      - run: cargo build --locked --no-default-features
  real-lsp:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-analyzer
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g pyright
      - run: cargo test --locked --test resolve_accuracy -- --ignored --nocapture
        env:
          CODE_RCL_TEST_PRECISE: '1'

  real-model:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo build --locked
      - run: python scripts/test-embedding-model.py ${{ github.event.inputs.retrieval_benchmark == 'true' && '--eval-retrieval' || '' }}
      - run: python scripts/ci-indexing-benchmark.py
        if: github.event.inputs.indexing_benchmark == 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedding-model-${{ matrix.os }}
          path: target/embedding-model-test.log
      - uses: actions/upload-artifact@v4
        if: always() && github.event.inputs.retrieval_benchmark == 'true'
        with:
          name: retrieval-benchmark-${{ matrix.os }}
          path: target/retrieval-evaluation-baseline/
      - uses: actions/upload-artifact@v4
        if: always() && github.event.inputs.indexing_benchmark == 'true'
        with:
          name: indexing-benchmark-${{ matrix.os }}
          path: target/indexing-speed/
