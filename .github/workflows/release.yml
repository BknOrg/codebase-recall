name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  build-binaries:
    needs: checks
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: ''
            bin_name: code-rcl
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            features: '--no-default-features --features viewer'
            bin_name: code-rcl
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: code-rcl.exe
            archive_ext: zip
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bin_name: code-rcl
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: code-rcl
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Compile Release
        run: cargo build --locked --release --target ${{ matrix.target }} ${{ matrix.features }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package and smoke test extracted archive
        run: python scripts/package-release.py --target ${{ matrix.target }} --extension ${{ matrix.archive_ext }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.target }}
          path: codebase-recall-${{ matrix.target }}.*

  publish-release:
    name: Publish Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            scripts/codebase-recall-installer.sh
            scripts/codebase-recall-installer.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
